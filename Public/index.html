<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleBoard</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/main.js"></script>
</head>
<body>
  <div class="app-shell">
    <header>
      <div>
        <h1>SimpleBoard</h1>
        <p class="subtitle">Swift 서버로 만든 작은 게시판</p>
      </div>
      <div class="status" id="status">준비 중</div>
    </header>

    <main>
      <form id="postForm">
        <h2 id="formTitle">새 글 작성</h2>
        <input type="hidden" id="postId">
        <label>
          제목
          <input id="title" name="title" maxlength="120" required placeholder="제목을 입력하세요">
        </label>
        <label>
          내용
          <textarea id="body" name="body" required placeholder="내용을 입력하세요"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" id="submitButton">등록</button>
          <button type="button" class="secondary" id="cancelButton" hidden>취소</button>
        </div>
      </form>

      <section class="posts-panel" aria-live="polite">
        <div class="panel-header">
          <h2>게시글</h2>
          <button type="button" class="secondary" id="refreshButton">새로고침</button>
        </div>
        <div class="posts" id="posts"></div>
      </section>
    </main>
  </div>
</body>
</html>
